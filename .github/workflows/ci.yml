name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Cross-platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Report environment
        run: python -c "import platform, sys; print(sys.version); print(platform.platform())"

      - name: Validate skills
        run: python -I scripts/validate.py --skills-dir skills

      - name: Check repository
        run: python scripts/check_repository.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  python-versions:
    name: Python / ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run validation suite
        run: |
          python -VV
          python -I scripts/validate.py --skills-dir skills
          python scripts/check_repository.py
          python -m unittest discover -s tests -v

  result:
    name: CI
    if: always()
    needs: [cross-platform, python-versions]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        env:
          CROSS_PLATFORM_RESULT: ${{ needs.cross-platform.result }}
          PYTHON_RESULT: ${{ needs.python-versions.result }}
        run: test "$CROSS_PLATFORM_RESULT" = success && test "$PYTHON_RESULT" = success
